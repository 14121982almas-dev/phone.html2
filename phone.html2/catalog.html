<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#111827;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
}

.logo{
    font-size:30px;
    color:#38bdf8;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.search{
    text-align:center;
    margin:30px;
}

.search input{
    width:350px;
    max-width:90%;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:40px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
}

.info{
    padding:20px;
}

.price{
    color:#2563eb;
    font-size:24px;
    margin:10px 0;
    font-weight:bold;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:40px;
}
</style>

const container=document.getElementById("phones");

function showPhones(list){

container.innerHTML="";

list.forEach(phone=>{

container.innerHTML+=`

<div class="card">

<img src="${phone.img}">

<div class="info">

<h2>${phone.name}</h2>

<p class="price">${phone.price}</p>

<button>Добавить в корзину</button>

</div>

</div>

`;

});

}

showPhones(phones);

document.getElementById("search").addEventListener("keyup",function(){

const text=this.value.toLowerCase();

const result=phones.filter(phone=>phone.name.toLowerCase().includes(text));

showPhones(result);

});

</script>
