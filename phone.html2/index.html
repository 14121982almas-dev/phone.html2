<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#111827;
color:white;
padding:20px 60px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{
font-size:30px;
font-weight:bold;
color:#38bdf8;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:18px;
}

.hero{
background:linear-gradient(120deg,#2563eb,#38bdf8);
color:white;
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:50px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
}

.search{
text-align:center;
margin:30px;
}

.search input{
padding:15px;
width:350px;
font-size:18px;
border-radius:8px;
border:1px solid gray;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:40px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card-body{
padding:20px;
}

.card h2{
margin-bottom:10px;
}

.price{
color:#2563eb;
font-size:25px;
font-weight:bold;
margin:10px 0;
}

button{
width:100%;
padding:12px;
border:none;
background:#2563eb;
color:white;
font-size:18px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

footer{
background:#111827;
color:white;
text-align:center;
padding:30px;
margin-top:50px;
}

@media(max-width:600px){
.search input{
width:90%;
}

.hero h1{
font-size:35px;
}

header{
padding:20px;
flex-direction:column;
gap:15px;
}
}
</style>

</head>

const container=document.getElementById("phones");

function showPhones(list){

container.innerHTML="";

list.forEach(phone=>{

container.innerHTML+=`

<div class="card">

<img src="${phone.img}">

<div class="card-body">

<h2>${phone.name}</h2>

<p class="price">${phone.price}</p>

<button>Купить</button>

</div>

</div>

`;

});

}

showPhones(phones);

document.getElementById("search").addEventListener("keyup",function(){

const value=this.value.toLowerCase();

const filtered=phones.filter(phone=>

phone.name.toLowerCase().includes(value)

);

showPhones(filtered);

});

</script>
